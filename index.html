<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Física 1 — Animaciones</title>
<style>
:root{
  --bg:#f5f6f9; --card:#ffffff; --ink:#1b2130; --muted:#5b6579; --line:#dde2ea; --accent:#2457d6;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0e1117; --card:#161b25; --ink:#e8ecf4; --muted:#9aa4b8; --line:#2a3242; --accent:#6ea0ff}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:32px 16px 70px}
h1{font-size:1.6rem;line-height:1.25;margin:0 0 6px}
.lead{color:var(--muted);margin:0 0 24px}
ol{list-style:none;padding:0;margin:0;display:grid;gap:12px}
a.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:16px 18px;color:inherit;text-decoration:none}
a.card:hover{border-color:var(--accent)}
a.card b{color:var(--accent)}
a.card span{display:block;color:var(--muted);font-size:.95rem}
footer{margin-top:32px;color:var(--muted);font-size:.9rem}
footer a{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Física 1 (DF, Otero y Garzón)</h1>
  <p class="lead">Animaciones interactivas de algunos problemas de las guías. Cada una resuelve el
    problema numéricamente en el navegador; no reemplazan la resolución analítica.</p>
  <ol id="list"></ol>
  <footer>
    Código fuente, notebook de Colab e instrucciones:
    <a href="https://github.com/joctavio287/Fisica1DFOteroyGarzon2026">repositorio en GitHub</a>.
  </footer>
</div>
<script src="nav.js"></script>
<script>
document.getElementById('list').innerHTML = PAGES.map(p =>
  `<li><a class="card" href="${p.file}"><b>${p.title}</b><span>${p.desc}</span></a></li>`
).join('');
</script>
</body>
</html>
